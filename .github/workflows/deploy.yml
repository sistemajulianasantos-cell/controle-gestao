name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versão do sistema = commit publicado. A página compara com a do site
      # e avisa/atualiza quando sai uma nova (ver fim do index.html).
      - name: Gravar versao
        run: sed -i "s/<meta name=\"versao-sistema\" content=\"__VERSAO__\">/<meta name=\"versao-sistema\" content=\"${GITHUB_SHA}\">/" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
