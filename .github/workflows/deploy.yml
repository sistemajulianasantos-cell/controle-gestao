name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versão do sistema = commit publicado. A página compara com a do site
      # e avisa/atualiza quando sai uma nova (ver fim do index.html).
      - name: Gravar versao
        run: sed -i "s/<meta name=\"versao-sistema\" content=\"__VERSAO__\">/<meta name=\"versao-sistema\" content=\"${GITHUB_SHA}\">/" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      # O GitHub às vezes falha aqui com "No artifacts named github-pages were
      # found" logo após o upload (11-25: 3 de 5 publicações). Tenta de novo
      # depois de alguns segundos em vez de deixar o site na versão antiga.
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Aguardar antes de tentar de novo
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (2a tentativa)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Aguardar antes da ultima tentativa
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (3a tentativa)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
